  "\u5206\u4f4d\u6570\u6807\u51c6\u5316": "quantile norm."
  "\u0394\u53c2\u8003\u6821\u6b63": "\u0394-reference"
  "ComBat(\u6c60\u5316)": "ComBat (pooled)"
  "\u6052\u7b49\u6027\u9a8c\u8bc1": "identity check"
  "\u53ef\u91cd\u590d\u6027\u5929\u82b1\u677f": "reproducibility ceiling"
  "\u6570\u503c\u6052\u7b49\u9608\u503c": "identity threshold"
  "\u9000\u5316\u9608\u503c": "degeneracy threshold"
  "\u5b9e\u8d28\u4e0b\u9650": "substantive floor"
  "null 95 \u5206\u4f4d": "null 95th pct"
