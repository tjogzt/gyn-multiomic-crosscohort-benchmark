figure_method:
  "1_SNF": "SNF"
  "2_NMF(concat)": "NMF"
  "3_KMeans(concat)": "KMeans"
  "4_PCA(concat)": "PCA"
  "5_\u8c31\u5d4c\u5165(concat)": "Spectral"
  "6_\u5171\u8054\u5171\u8bc6": "Co-assoc."
  "7_MCCA-lite": "MCCA"
  "8_MOFA-lite": "MOFA"
  "2_intNMF\u7b49\u4ef7": "intNMF*"
  "6_MOFA2": "MOFA2"
  "5_iClusterPlus": "iCluster"
  "3_MCIA\u7b49\u4ef7(MFA)": "MCIA*"
  "4_mixOmics": "mixOmics"

# Layer key -> short label printed in a figure axis.
figure_layer:
  "\u8868\u8fbe": "mRNA"
  "\u62f7\u8d1d\u6570": "CNA"
  "\u7532\u57fa\u5316": "Methylation"
  "\u86cb\u767d": "Protein"
  "mRNA": "mRNA"
  "miRNA": "miRNA"
  "CNA": "CNA"
  "meth": "Methylation"
  "RPPA": "RPPA"
  "\u7532\u57fa\u5316450K": "Methylation450K"

